<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SNHRM | Registro de restauración</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f4ef;
            color: #26352b;
        }

        header {
            background: #294936;
            color: white;
            text-align: center;
            padding: 28px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            margin: 8px 0 0;
            opacity: 0.9;
        }

        main {
            max-width: 650px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
        }

        .foto {
            width: 100%;
            height: 220px;
            background: #dfe7dc;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #657565;
            margin-bottom: 25px;
        }

        h2 {
            margin-top: 0;
            font-size: 28px;
        }

        .id {
            display: inline-block;
            background: #294936;
            color: white;
            padding: 7px 12px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .dato {
            border-bottom: 1px solid #e2e6e1;
            padding: 14px 0;
        }

        .dato:last-child {
            border-bottom: none;
        }

        .etiqueta {
            display: block;
            font-size: 13px;
            color: #718071;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .valor {
            font-size: 17px;
        }

        .estado {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 7px;
            background: #e2f0e4;
            color: #285b34;
            font-weight: bold;
        }

        .error {
            text-align: center;
        }

        .error h2 {
            color: #9b3838;
        }

        footer {
            text-align: center;
            padding: 30px 20px;
            color: #718071;
            font-size: 13px;
        }

    </style>
</head>


<body>

<header>

    <h1>SNHRM</h1>

    <p>
        Registro de restauración ecológica
    </p>

</header>


<main>

    <div id="contenido"></div>

</main>


<footer>

    SNHRM · Sistema de registro de vegetación

</footer>


<script>


/*
==================================================
BASE DE DATOS DE PLANTAS
==================================================

Cada planta tiene un ID único.

Formato recomendado:

M_MO_01

M = sitio/módulo

MO = especie

01 = número individual

==================================================
*/


const plantas = {


    "M_MO_01": {

        nombre: "Molle",

        nombreCientifico: "Schinus molle",

        familia: "Anacardiaceae",

        sitio: "Miyawaki",

        estado: "Registrada",

        fechaPlantacion: "2026-08-08",

        observaciones:
            "Planta registrada mediante sistema NFC."

    },


    "M_HU_01": {

        nombre: "Huingán",

        nombreCientifico: "Schinus polygamus",

        familia: "Anacardiaceae",

        sitio: "Miyawaki",

        estado: "Registrada",

        fechaPlantacion: "2026-08-08",

        observaciones:
            "Planta registrada mediante sistema NFC."

    },


    "M_CR_01": {

        nombre: "Coralillo",

        nombreCientifico: "Lycium chilense",

        familia: "Solanaceae",

        sitio: "Miyawaki",

        estado: "Registrada",

        fechaPlantacion: "2026-08-08",

        observaciones:
            "Planta registrada mediante sistema NFC."

    }


};


/*
==================================================
OBTENER ID DESDE EL LINK DEL NFC
==================================================
*/


const parametros = new URLSearchParams(
    window.location.search
);

const id = parametros.get("id");


/*
==================================================
MOSTRAR FICHA
==================================================
*/


const contenido =
    document.getElementById("contenido");


if (!id) {

    contenido.innerHTML = `

        <div class="card error">

            <h2>SNHRM</h2>

            <p>
                No se encontró un ID de planta.
            </p>

            <p>
                Escanea nuevamente la etiqueta NFC.
            </p>

        </div>

    `;

}


else if (!plantas[id]) {

    contenido.innerHTML = `

        <div class="card error">

            <h2>Planta no encontrada</h2>

            <p>
                ID registrado:
            </p>

            <div class="id">
                ${id}
            </div>

            <p>
                Este ID todavía no existe
                en la base de datos SNHRM.
            </p>

        </div>

    `;

}


else {

    const planta = plantas[id];


    contenido.innerHTML = `

        <div class="card">

            <div class="foto">

                Foto de la planta

            </div>


            <h2>
                ${planta.nombre}
            </h2>


            <div class="id">
                ${id}
            </div>


            <div class="dato">

                <span class="etiqueta">
                    Nombre científico
                </span>

                <span class="valor">
                    ${planta.nombreCientifico}
                </span>

            </div>


            <div class="dato">

                <span class="etiqueta">
                    Familia
                </span>

                <span class="valor">
                    ${planta.familia}
                </span>

            </div>


            <div class="dato">

                <span class="etiqueta">
                    Sitio / método
                </span>

                <span class="valor">
                    ${planta.sitio}
                </span>

            </div>


            <div class="dato">

                <span class="etiqueta">
                    Estado
                </span>

                <span class="estado">
                    ${planta.estado}
                </span>

            </div>


            <div class="dato">

                <span class="etiqueta">
                    Fecha de plantación
                </span>

                <span class="valor">
                    ${planta.fechaPlantacion}
                </span>

            </div>


            <div class="dato">

                <span class="etiqueta">
                    Observaciones
                </span>

                <span class="valor">
                    ${planta.observaciones}
                </span>

            </div>


        </div>

    `;

}


</script>

</body>

</html>
